# AromaBank Lightweight Local Big Data Streaming Stack
# Low-resource container configuration for self-hosting on laptop without cloud costs.
# Includes: Kafka KRaft (no Zookeeper), Oracle 23c Free with CDC, Debezium, and Apache Flink.

services:
  # 1. Apache Kafka 3.7 (KRaft mode - ultra lightweight, ~250MB RAM)
  kafka:
    image: apache/kafka:3.7.0
    container_name: aromabank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "4L622nShTZaBtMVipXHVmw"
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. #CDC: Oracle Database 23c Free with ArchiveLog enabled for LogMiner
  oracle-free:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: aromabank-oracle-cdc
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "OracleSecret2024!"
      ENABLE_ARCHIVELOG: "true" # #CDC: Activates ArchiveLog mode on container startup
    volumes:
      - ./cdc/oracle/01_setup_archivelog.sql:/container-entrypoint-initdb.d/01_setup_archivelog.sql:ro
      - ./cdc/oracle/02_create_cdc_user.sql:/container-entrypoint-initdb.d/02_create_cdc_user.sql:ro
      - ./cdc/oracle/03_create_tables.sql:/container-entrypoint-initdb.d/03_create_tables.sql:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  # 3. #CDC: Debezium Kafka Connect with Oracle LogMiner connector
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: aromabank-debezium
    depends_on:
      - kafka
      - oracle-free
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium-cluster
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    deploy:
      resources:
        limits:
          memory: 768M

  # 4. Apache Flink JobManager (Java 17 runtime)
  flink-jobmanager:
    image: flink:1.18.1-java17
    container_name: aromabank-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
    deploy:
      resources:
        limits:
          memory: 512M

  # 5. Apache Flink TaskManager
  flink-taskmanager:
    image: flink:1.18.1-java17
    container_name: aromabank-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    deploy:
      resources:
        limits:
          memory: 512M

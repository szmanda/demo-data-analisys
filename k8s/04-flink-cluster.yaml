apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: aromabank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink
        component: jobmanager
    spec:
      containers:
        - name: jobmanager
          image: flink:1.18.1-java17
          args: ["jobmanager"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "150m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - containerPort: 8081
              name: webui
            - containerPort: 6123
              name: rpc
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "flink-jobmanager"
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: aromabank
spec:
  selector:
    app: flink
    component: jobmanager
  ports:
    - port: 8081
      targetPort: 8081
      name: webui
    - port: 6123
      targetPort: 6123
      name: rpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: aromabank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink
        component: taskmanager
    spec:
      containers:
        - name: taskmanager
          image: flink:1.18.1-java17
          args: ["taskmanager"]
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: "flink-jobmanager"
            - name: TASK_MANAGER_NUMBER_OF_TASK_SLOTS
              value: "2"
